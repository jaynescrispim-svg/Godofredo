/* =========================================================
   GODOFREDO — LIQUID GLASS / MIDNIGHT NAVY VISUAL SYSTEM
   ========================================================= */
:root{
  --bg:#06101f;
  --bg-2:#07172b;
  --surface:rgba(13,31,53,.58);
  --surface2:rgba(17,42,72,.54);
  --surface3:rgba(6,19,34,.66);
  --text:#f5f8ff;
  --muted:#9eacc1;
  --line:rgba(170,205,255,.13);
  --accent:#8fc7ff;
  --accent-2:#4da3ff;
  --accent-soft:rgba(77,163,255,.16);
  --danger:#ff929f;
  --warning:#f5cf85;
  --info:#9ec9ff;
  --glass-blur:22px;
  --glass-sat:125%;
  --shadow:0 24px 70px rgba(0,0,0,.35);
  --inner:inset 0 1px 0 rgba(255,255,255,.09), inset 0 -1px 0 rgba(0,0,0,.18);
}

html,body{
  background:
    radial-gradient(900px 600px at 85% -10%, rgba(43,127,255,.25), transparent 62%),
    radial-gradient(700px 520px at 10% 15%, rgba(30,87,170,.18), transparent 66%),
    linear-gradient(145deg,#04101e 0%,#061426 50%,#071a30 100%);
  color:var(--text);
}

body{
  position:relative;
  overflow-x:hidden;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body::before,
body::after{
  content:"";
  position:fixed;
  pointer-events:none;
  z-index:-1;
  filter:blur(30px);
  border-radius:999px;
  mix-blend-mode:screen;
}
body::before{
  width:460px;height:460px;
  left:-150px;top:22vh;
  background:radial-gradient(circle,rgba(36,135,255,.22),transparent 68%);
}
body::after{
  width:540px;height:540px;
  right:-180px;bottom:-120px;
  background:radial-gradient(circle,rgba(28,95,214,.20),transparent 68%);
}

.app{
  min-height:100vh;
  background:linear-gradient(180deg,rgba(3,13,25,.18),rgba(3,10,20,.08));
}

.sidebar{
  background:linear-gradient(180deg,rgba(5,17,31,.78),rgba(3,12,24,.66));
  border-right:1px solid rgba(164,203,255,.11);
  box-shadow:18px 0 50px rgba(0,0,0,.18);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
}

.brand{
  color:#f6f9ff;
  text-shadow:0 0 24px rgba(105,177,255,.16);
}
.brand small{color:#8ea4bd}

nav a,
.nav-item,
.sidebar a{
  border:1px solid transparent;
  border-radius:14px;
  transition:.22s ease;
}
nav a:hover,
.nav-item:hover,
.sidebar a:hover{
  background:rgba(66,143,225,.09);
  border-color:rgba(132,188,255,.11);
  transform:translateX(2px);
}
nav a.active,
.nav-item.active,
.sidebar a.active{
  background:linear-gradient(135deg,rgba(58,137,229,.20),rgba(76,167,255,.07));
  border-color:rgba(123,190,255,.18);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 10px 26px rgba(0,55,130,.15);
  color:#f4f8ff;
}

main,
.content,
.page,
.view,
section{
  position:relative;
}

.topbar,
.header,
.toolbar,
.card,
.panel,
.widget,
.modal,
.modal-card,
.sheet,
.stat,
.kpi,
.item,
.list-item,
.timeline-item,
.task-card,
.event-card,
.glass{
  background:linear-gradient(145deg,rgba(17,44,75,.56),rgba(5,21,38,.50));
  border:1px solid rgba(158,202,255,.13);
  box-shadow:var(--shadow),var(--inner);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
}

.topbar,
.header,
.toolbar{
  border-radius:20px;
}

.card,
.panel,
.widget,
.stat,
.kpi,
.item,
.list-item,
.timeline-item,
.task-card,
.event-card{
  border-radius:20px;
  transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
}

.card:hover,
.panel:hover,
.widget:hover,
.stat:hover,
.kpi:hover,
.item:hover,
.list-item:hover,
.timeline-item:hover,
.task-card:hover,
.event-card:hover{
  transform:translateY(-2px);
  border-color:rgba(149,204,255,.20);
  box-shadow:0 28px 76px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.10);
}

h1,h2,h3,h4{
  letter-spacing:-.02em;
  color:#f7faff;
}
h1{ text-shadow:0 0 32px rgba(95,173,255,.08); }

button,
.btn,
.action{
  border:1px solid rgba(150,201,255,.14);
  border-radius:13px;
  background:linear-gradient(145deg,rgba(42,91,145,.34),rgba(12,32,57,.55));
  color:#f4f8ff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 22px rgba(0,0,0,.16);
  transition:.2s ease;
}
button:hover,
.btn:hover,
.action:hover{
  transform:translateY(-1px);
  border-color:rgba(157,210,255,.28);
  background:linear-gradient(145deg,rgba(56,116,182,.42),rgba(14,39,68,.62));
  box-shadow:0 12px 30px rgba(15,79,150,.22),inset 0 1px 0 rgba(255,255,255,.11);
}
button:active,
.btn:active,
.action:active{
  transform:translateY(0);
}

input,
textarea,
select{
  background:rgba(5,18,33,.54);
  border:1px solid rgba(150,201,255,.14);
  color:#f2f7ff;
  border-radius:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  outline:none;
  transition:.2s ease;
}
input:focus,
textarea:focus,
select:focus{
  border-color:rgba(102,179,255,.48);
  box-shadow:0 0 0 4px rgba(68,151,255,.10),0 0 26px rgba(35,120,228,.10);
}
::placeholder{color:#71849b}

.badge,
.tag,
.chip,
.pill{
  background:rgba(49,124,215,.12);
  border:1px solid rgba(127,191,255,.16);
  color:#b8d9ff;
  border-radius:999px;
}

.progress,
.progress-track{
  background:rgba(164,201,235,.09);
  border:1px solid rgba(149,198,255,.08);
  overflow:hidden;
}
.progress > *,
.progress-bar{
  background:linear-gradient(90deg,#4d9df5,#8bc8ff);
  box-shadow:0 0 20px rgba(68,158,255,.38);
}

a{color:#abd4ff}
small,.muted,.subtle{color:var(--muted)}

.modal-backdrop,
.overlay{
  background:rgba(2,10,20,.56);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.modal,
.modal-card,
.sheet{
  background:linear-gradient(145deg,rgba(18,46,79,.82),rgba(5,18,34,.82));
  border-color:rgba(160,210,255,.18);
  box-shadow:0 40px 120px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.10);
}

hr{
  border:0;
  border-top:1px solid rgba(158,202,255,.10);
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(107,170,236,.32),rgba(83,131,190,.20));
  border:2px solid transparent;
  background-clip:padding-box;
  border-radius:999px;
}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,rgba(127,190,255,.48),rgba(88,140,205,.28))}

body.light{
  --bg:#e9f1f9;
  --bg-2:#dce9f7;
  --surface:rgba(255,255,255,.68);
  --surface2:rgba(247,251,255,.74);
  --surface3:rgba(237,245,253,.80);
  --text:#14233a;
  --muted:#63758a;
  --line:rgba(39,81,125,.13);
  --accent:#2d79c7;
  --accent-2:#1d6fc1;
}
body.light{
  background:
    radial-gradient(850px 520px at 85% -10%,rgba(91,164,238,.22),transparent 65%),
    radial-gradient(700px 480px at 12% 12%,rgba(110,180,246,.16),transparent 68%),
    linear-gradient(145deg,#edf5fc,#dfeaf6 55%,#e8f1f9);
}
body.light .sidebar{
  background:linear-gradient(180deg,rgba(250,253,255,.78),rgba(230,240,250,.72));
}
body.light .topbar,
body.light .header,
body.light .toolbar,
body.light .card,
body.light .panel,
body.light .widget,
body.light .stat,
body.light .kpi,
body.light .item,
body.light .list-item,
body.light .timeline-item,
body.light .task-card,
body.light .event-card{
  background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(232,242,252,.58));
  border-color:rgba(67,112,157,.14);
  box-shadow:0 20px 55px rgba(60,104,148,.14),inset 0 1px 0 rgba(255,255,255,.80);
}
body.light input,
body.light textarea,
body.light select{
  background:rgba(255,255,255,.68);
  color:#14233a;
}

.main{max-width:1500px}

}
.top::after{
  content:"";

  inset:0;

  pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.045),transparent 35%,rgba(86,165,255,.035) 72%,transparent);

.top-actions{position:relative;z-index:1}

}

.search{
  min-width:245px;
  border-radius:14px !important;

}
.card::before{

@media (max-width:900px){

/* =========================================================
   GODOFREDO — SIGNATURE PREMIUM UI
   ========================================================= */
:root{
 --ink:#f7fbff;
 --ink-soft:#c7d6e8;
 --ink-dim:#8299b3;
 --line-soft:rgba(167,211,255,.10);
 --line-mid:rgba(167,211,255,.16);
 --glow-blue:rgba(79,166,255,.18);
 --glow-blue-2:rgba(128,204,255,.10);
 --surface-luxe:linear-gradient(145deg,rgba(16,43,73,.60),rgba(4,17,31,.54));
 --surface-luxe-2:linear-gradient(145deg,rgba(18,49,83,.42),rgba(5,20,36,.48));
}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
::selection{background:rgba(85,168,255,.28);color:#fff}

/* refined shell */
.main{position:relative}
.main::before{
 content:"";position:absolute;inset:0 0 auto 0;height:180px;pointer-events:none;
 background:linear-gradient(180deg,rgba(66,145,225,.035),transparent);
}
.top{border-radius:24px;padding:13px 15px}
.top-actions{gap:7px}
.top-actions .btn{min-height:42px}
.search{height:42px}

/* refined headings */
h1,h2,h3,h4{font-weight:620}
h3{font-size:15px}
.kicker,.hero-label{font-weight:750}
.small{font-size:10px}
.meta{font-size:10px;color:var(--ink-dim)}

/* premium cards */
.card{
 box-shadow:0 22px 65px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.075);
}
.card::after{
 content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(135deg,rgba(255,255,255,.028),transparent 28%,transparent 72%,rgba(83,164,247,.025));
}
.stat-card{min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.stat-card .metric{font-size:31px}

/* elegant buttons */
.btn{min-height:38px;padding:9px 13px}
.btn.primary{
 background:linear-gradient(145deg,rgba(91,169,248,.42),rgba(35,91,151,.42));
 border-color:rgba(153,214,255,.23);
 box-shadow:0 10px 28px rgba(29,115,204,.15),inset 0 1px 0 rgba(255,255,255,.10);
}
.btn.primary:hover{
 background:linear-gradient(145deg,rgba(105,181,255,.52),rgba(39,102,169,.50));
 box-shadow:0 14px 34px rgba(28,118,207,.22),inset 0 1px 0 rgba(255,255,255,.13);
}

/* polished list rows */
.list>.item{
 min-height:58px;
 background:linear-gradient(145deg,rgba(12,33,56,.46),rgba(4,17,30,.32));
}
.item .actions{opacity:.76;transition:.2s}
.item:hover .actions{opacity:1}

/* subtle status language */
.notice{border-radius:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.badge{padding:5px 8px}

/* dashboard signature */
.dashboard-hero{
 border-radius:30px;
 min-height:218px;
 padding:30px;
}
.dashboard-hero:after{
 content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(380px 180px at 76% 12%,rgba(136,210,255,.07),transparent 68%);
}
.hero-title{font-weight:590}
.hero-date{text-transform:capitalize}
.quick-strip{gap:9px}
.quick-action{background:linear-gradient(145deg,rgba(16,43,73,.52),rgba(4,18,32,.46))}

/* input polish */
input,textarea,select{min-height:42px}
textarea{line-height:1.5}
select{appearance:auto}

/* section labels */
.section-caption{letter-spacing:.015em}

/* premium empty states */
.empty{
 min-height:82px;
 display:grid;
 place-items:center;
 padding:22px;
 color:#6e87a3;
 border:1px dashed rgba(135,186,237,.10);
 border-radius:15px;
 background:rgba(2,15,28,.14);
 text-align:center;
}

/* glass tabs */
.vision-tabs,.reading-tabs{
 padding:4px;
 border:1px solid var(--line-soft);
 border-radius:15px;

function openForm(type, recordId=null, prefill={}){
 const schema=SCHEMA[type]; if(!schema)return;
 const old=recordId?(state[type]||[]).find(x=>String(x.id)===String(recordId)):null;
 const seed={...(prefill||{})};
 if(old)Object.assign(seed,old);
 const requiredFields=new Set(['title','name','description']);
 const numericRules={
  value:{min:0},
  progress:{min:0,max:100},
  rating:{min:1,max:5,step:1},
  pages:{min:0,step:1},
  currentPage:{min:0,step:1},
  duration:{min:0,step:1},
  installments:{min:1,step:1},
  limit:{min:0},
  balance:{},
  due:{min:1,max:31,step:1},
  closing:{min:1,max:31,step:1}
 };
 document.getElementById('modalTitle').textContent=`${old?'Editar':'Novo'} ${schema.label}`;
 const fields=schema.fields.map(([name,label,kind,opts])=>{
   let v=seed[name]??'';
   if((name==='date'||name==='start')&&!v&&!old)v=today();
   if(name==='status'&&!v && Array.isArray(opts))v=Array.isArray(opts[0])?opts[0][0]:opts[0];
   if(name==='priority'&&!v && Array.isArray(opts))v=Array.isArray(opts[1])?opts[1][0]:opts[1]||opts[0];
   if(kind==='textarea')return `<div class="field"><label for="f_${name}">${label}${requiredFields.has(name)?' <span class="req">*</span>':''}</label><textarea id="f_${name}" data-field-name="${name}"${requiredFields.has(name)?' required':''} placeholder="${placeholderFor(type,name)}">${esc(v)}</textarea><div class="field-help" id="help_${name}"></div></div>`;
   if(kind==='relation')return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" data-field-name="${name}"><option value="">Nenhum</option>${(state[opts]||[]).map(x=>`<option value="${x.id}" ${String(v)===String(x.id)?'selected':''}>${esc(x.title||x.name)}</option>`).join('')}</select></div>`;
   if(kind==='select')return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" data-field-name="${name}">${opts.map(x=>Array.isArray(x)?`<option value="${esc(x[0])}" ${String(v)===String(x[0])?'selected':''}>${esc(x[1])}</option>`:`<option value="${esc(x)}" ${String(v)===String(x)?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
   if(kind==='checkbox')return `<div class="field"><label class="check-field"><input id="f_${name}" data-field-name="${name}" type="checkbox" ${v===true||String(v)==='true'||String(v)==='1'?'checked':''}><span>${label}</span></label><div class="field-help" id="help_${name}"></div></div>`;
   const nr=numericRules[name]||{};
   const attrs=[
     `id="f_${name}"`,`data-field-name="${name}"`,`type="${kind}"`,`value="${esc(v)}"`,
     requiredFields.has(name)?'required':'',
     nr.min!==undefined?`min="${nr.min}"`:'',
     nr.max!==undefined?`max="${nr.max}"`:'',
     nr.step!==undefined?`step="${nr.step}"`:kind==='number'?'step="any"':'',
     kind==='number'?`inputmode="decimal"`:''
   ].filter(Boolean).join(' ');
   return `<div class="field"><label for="f_${name}">${label}${requiredFields.has(name)?' <span class="req">*</span>':''}</label><input ${attrs} placeholder="${placeholderFor(type,name)}"><div class="field-help" id="help_${name}"></div></div>`;
 }).join('');
 document.getElementById('modalBody').innerHTML=`<form class="form" id="godForm" novalidate>${fields}<div class="form-status" id="formStatus" aria-live="polite"></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn primary" data-action="save-form" data-type="${type}" data-id="${recordId||''}">Salvar</button></div></form>`;
 document.getElementById('modalBg').classList.add('show');
 const form=document.getElementById('godForm');
 form?.querySelector('input:not([type="checkbox"]), textarea, select')?.focus();
}

  body:'Escreva aqui…',

  category:'Ex.: Pessoal',
  phone:'(00) 00000-0000',
  email:'nome@exemplo.com',
  destination:'Ex.: Lisboa',
  location:'Ex.: Escritório',
  author:'Nome do autor',
  currentPage:'Ex.: 72'
 };

}
function validateForm(type){
 const schema=SCHEMA[type], status=document.getElementById('formStatus');
 const errors=[];
 (schema?.fields||[]).forEach(([name,label,kind])=>{
  const el=document.getElementById('f_'+name); if(!el)return;
  const help=document.getElementById('help_'+name);
  el.classList.remove('invalid'); if(help)help.textContent='';
  if(el.required && !String(el.value||'').trim()){
    errors.push(`${label} é obrigatório.`);
    el.classList.add('invalid');
    if(help)help.textContent='Preencha este campo.';
    return;
  }
  if(kind==='number' && el.value!==''){
    const n=Number(el.value);
    if(!Number.isFinite(n)){errors.push(`${label} precisa ser numérico.`);el.classList.add('invalid');if(help)help.textContent='Informe um número válido.';return}
    if(el.min!=='' && n<Number(el.min)){errors.push(`${label} não pode ser menor que ${el.min}.`);el.classList.add('invalid');if(help)help.textContent=`Mínimo: ${el.min}.`;}
    if(el.max!=='' && n>Number(el.max)){errors.push(`${label} não pode ser maior que ${el.max}.`);el.classList.add('invalid');if(help)help.textContent=`Máximo: ${el.max}.`;}
  }
  if(kind==='date' && el.value && !/^\d{4}-\d{2}-\d{2}$/.test(el.value)){errors.push(`${label} contém uma data inválida.`);el.classList.add('invalid');if(help)help.textContent='Use uma data válida.';}
 });
 if(type==='trips'){
   const start=document.getElementById('f_start')?.value,end=document.getElementById('f_end')?.value;
   if(start&&end&&end<start){errors.push('A data de volta não pode ser anterior à ida.');document.getElementById('f_start')?.classList.add('invalid');document.getElementById('f_end')?.classList.add('invalid');}
 }
 if(type==='readings'){
   const pages=Number(document.getElementById('f_pages')?.value||0),currentPage=Number(document.getElementById('f_currentPage')?.value||0);
   if(pages&&currentPage>pages){errors.push('A página atual não pode ultrapassar o total de páginas.');document.getElementById('f_currentPage')?.classList.add('invalid');}
 }
 if(type==='timeBlocks'){
   const candidate={date:document.getElementById('f_date')?.value||'',start:document.getElementById('f_start')?.value||'',end:document.getElementById('f_end')?.value||''};
   const r=timeBlockRange(candidate);
   if(r && r.end<=r.start){errors.push('O horário final precisa ser posterior ao início.');document.getElementById('f_end')?.classList.add('invalid');}
   const conflicts=timeBlockConflicts(candidate, window.__editingRecordId||'');
   if(conflicts.length){errors.push(`Este bloco conflita com ${conflicts.length} bloco(s) existente(s).`);document.getElementById('f_start')?.classList.add('invalid');document.getElementById('f_end')?.classList.add('invalid');}
 }
 if(status){
   status.className=`form-status${errors.length?' error':''}`;
   status.textContent=errors.length?errors.join(' '):'';
 }
 return !errors.length;
}
function closeModal(){document.getElementById('modalBg').classList.remove('show');window.__editingRecordId=''}
function saveForm(type,recordId){
 if(window.__godofredoSaveLock)return;
 window.__godofredoSaveLock=true;
 try{
 if(!validateForm(type))return;
 const schema=SCHEMA[type], obj={};
 schema.fields.forEach(([name,,kind])=>{
   const el=document.getElementById('f_'+name);
   let v=el?.type==='checkbox'?!!el.checked:(el?.value??'');
   if(kind==='number')v=v===''?'':Number(v);
   obj[name]=v;
 });
 obj.updatedAt=new Date().toLocaleString('pt-BR');
 if(type==='readings' && Number(obj.progress||0)>=100){obj.progress=100;obj.status='Concluído';if(!obj.finishedAt)obj.finishedAt=today();}
 if(recordId){
   const i=state[type].findIndex(x=>String(x.id)===String(recordId));
   if(i>=0)state[type][i]={...state[type][i],...obj}
 }else{
   obj.id=id();obj.createdAt=today();
   if(type==='tasks'||type==='events')obj.done=false;
   if(type==='habits')obj.streak=0;
   state[type].unshift(obj);
 }
 save();closeModal();render();toast(recordId?'Alterado com sucesso':'Adicionado com sucesso');
 }finally{
   setTimeout(()=>{window.__godofredoSaveLock=false},180);
 }
}

function deleteRecord(type,recordId){const arr=state[type]||[],item=arr.find(x=>String(x.id)===String(recordId));if(!item)return;if(!confirm(`Excluir "${item.title||item.name||item.description||item.text||'este registro'}"?`))return;state[type]=arr.filter(x=>String(x.id)!==String(recordId));save();render();toast('Excluído')}
function toggleRecord(type,recordId){
 if(type==='habits'){const k=`${recordId}::${today()}`;state.habitLog[k]=!state.habitLog[k];save();render();return}
 const x=state[type]?.find(i=>String(i.id)===String(recordId));if(x){x.done=!x.done;save();render()}
}
function habitDone(id,date=today()){return!!state.habitLog[`${id}::${date}`]}
function habitStreak(id){let n=0,d=new Date();for(let i=0;i<366;i++){const s=d.toISOString().slice(0,10);if(habitDone(id,s))n++;else break;d.setDate(d.getDate()-1)}return n}
function parseList(l){return String(l.items||'').split('\n').filter(Boolean).map(s=>{const [text,flag]=s.split('||');return{text,done:flag==='1'}})}
function saveList(l,a){l.items=a.map(x=>`${x.text}||${x.done?'1':'0'}`).join('\n')}
function addListItem(listId){const l=state.lists.find(x=>String(x.id)===String(listId));if(!l)return;const t=prompt('Novo item da lista:');if(t?.trim()){const a=parseList(l);a.push({text:t.trim(),done:false});saveList(l,a);save();render()}}
function toggleListItem(listId,index){const l=state.lists.find(x=>String(x.id)===String(listId));if(!l)return;const a=parseList(l);if(a[index]){a[index].done=!a[index].done;saveList(l,a);save();render()}}
function clearListDone(listId){const l=state.lists.find(x=>String(x.id)===String(listId));if(!l)return;saveList(l,parseList(l).filter(x=>!x.done));save();render()}

function scheduleTask(idv){

 const d=prompt('Digite a data no formato AAAA-MM-DD:',t.date||today());

 t.date=d;save();render();toast('Prazo atualizado');
}

function exportFullBackup(){
 const payload={format:'godofredo-backup',version:2,exportedAt:new Date().toISOString(),app:'GODOFREDO — Personal Operating System',state:deepClone(state)};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=`godofredo-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup exportado');
}
function importFullBackup(e){
 const f=e.target.files?.[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const raw=JSON.parse(r.result),incoming=raw?.state&&raw.format==='godofredo-backup'?raw.state:raw;
   if(!incoming||typeof incoming!=='object')throw new Error('invalid');
   const preview=merge(deepClone(DEFAULT),incoming);
   const total=Object.entries(preview).filter(([,v])=>Array.isArray(v)).reduce((a,[,v])=>a+v.length,0);
   if(confirm(`Importar este backup?\n\n${total} registros serão carregados. Seus dados atuais serão substituídos.`)){state=preview;save();render();toast('Backup importado')}
  }catch(err){console.error(err);alert('Não foi possível importar este backup. O arquivo pode estar inválido.')}
  e.target.value='';
 };
 r.readAsText(f);
}

 state.chat=state.chat||[];state.chat.push({id:id(),who:'user',text:t});
 const q=t.toLowerCase(),tomorrow=(()=>{const x=new Date();x.setDate(x.getDate()+1);return x.toISOString().slice(0,10)})();

   state.tasks.unshift(obj);return obj;
 };

 }else if(/(crie|adicion|nova|novo).*(tarefa)/.test(q)){
   const title=t.replace(/.*?(?:crie|adicione|adicionar|nova|novo)\s+(?:uma\s+)?tarefa\s*/i,'').replace(/\b(para|pra)\s+(hoje|amanhã|amanha)\b/gi,'').replace(/\b(urgente|alta prioridade|prioridade alta)\b/gi,'').trim()||'Nova tarefa';

   reply=`Tarefa “${title}” criada para ${fmt(due)}${priority==='Alta'?' com alta prioridade':''}.`;actionLabel='Abrir tarefa';actionType='tasks';actionId=obj.id;

 }else if(/(gastei|registre|lanç[ae]|lance).*\d/.test(q)){

function contactInitials(c){
 const n=String(c.name||'Contato').trim().split(/\s+/).filter(Boolean);
 return ((n[0]?.[0]||'')+(n.length>1?(n[n.length-1]?.[0]||''):'')).toUpperCase()||'C';
}
function contactBirthdayDays(c){
 if(!c.birthday)return null;
 const b=new Date(c.birthday+'T12:00:00'),now=new Date();
 let next=new Date(now.getFullYear(),b.getMonth(),b.getDate(),12);
 if(next<new Date(now.getFullYear(),now.getMonth(),now.getDate(),12))next.setFullYear(now.getFullYear()+1);
 return Math.round((next-new Date(now.getFullYear(),now.getMonth(),now.getDate(),12))/86400000);
}
function contactBirthdayLabel(c){
 const days=contactBirthdayDays(c);
 if(days===null)return 'Sem aniversário';
 if(days===0)return 'Aniversário hoje';
 if(days===1)return 'Amanhã';
 if(days<=7)return `Em ${days} dias`;
 return fmt(c.birthday);
}
function contactSearch(q){
 q=String(q||'').trim().toLowerCase();
 return (state.contacts||[]).filter(c=>!q||[c.name,c.company,c.role,c.phone,c.email,c.notes].some(v=>String(v||'').toLowerCase().includes(q)));
}

 (state.tasks||[]).forEach(x=>push(x.updatedAt?.slice(0,10)||x.date,'',x.title,'Tarefa', 'tasks',x.id,x.done?'Concluída':'Aberta'));
 (state.events||[]).forEach(x=>push(x.date,x.time,x.title,'Agenda','events',x.id,x.location||''));
 (state.transactions||[]).forEach(x=>push(x.date,'',x.description||x.title||'Lançamento','Finanças','transactions',x.id,x.type==='in'?'Entrada':'Saída'));

function taskEnergyValue(t){
 const raw=String(t.energy||t.energia||'').toLowerCase();
 return raw.includes('alta')||raw==='3'?3:raw.includes('baixa')||raw==='1'?1:2;
}
function taskImpactValue(t){
 const raw=String(t.impact||t.impacto||'').toLowerCase();
 return raw.includes('alto')||raw==='3'?3:raw.includes('baixo')||raw==='1'?1:2;
}
function taskSmartScore(t){
 const p=t.priority==='Alta'?4:t.priority==='Média'?2:1;
 const due=t.date?Math.max(0,14-Math.max(0,Math.round((new Date(t.date+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000))):0;
 return p*3+taskImpactValue(t)*2+(4-taskEnergyValue(t))+due;
}
function smartTaskQueue(limit=5){
 return (state.tasks||[]).filter(t=>!t.done).sort((a,b)=>taskSmartScore(b)-taskSmartScore(a)).slice(0,limit);
}
function schedulePressure(){
 const d=today(), tasks=(state.tasks||[]).filter(x=>!x.done&&x.date);
 const next7=tasks.filter(x=>x.date<=localDateKey(new Date(Date.now()+7*86400000)));
 const late=tasks.filter(x=>x.date<d);
 const eventsToday=(state.events||[]).filter(x=>x.date===d).length;
 const blocks=typeof timeBlockDailySummary==='function'?timeBlockDailySummary(d):{minutes:0};
 return {late,next7,todayCount:tasks.filter(x=>x.date===d).length,score:Math.min(100,late.length*18+next7.length*7+eventsToday*5+Math.min(5,Math.round((blocks.minutes||0)/90))*6)};
}
function intelligentScheduleSuggestion(){
 const p=schedulePressure(), q=smartTaskQueue(8);
 if(p.late.length)return {title:'Recupere o atraso primeiro',text:`Comece por “${p.late[0].title}”. Há ${p.late.length} tarefa(s) vencida(s).`,task:p.late[0]};
 const t=q.find(x=>x.date===today())||q[0];
 return t?{title:'Próxima melhor ação',text:`Reserve um bloco de foco para “${t.title}”.`,task:t}:{title:'Agenda livre',text:'Não há tarefas abertas suficientes para sugerir uma próxima ação.',task:null};
}


function planningEngine(){
 const days=agendaWeekDays(weekStartKey(today()));
 return days.map(day=>{
   const tasks=(state.tasks||[]).filter(x=>!x.done&&x.date===day);
   const events=(state.events||[]).filter(x=>x.date===day);
   const blocks=typeof timeBlockDailySummary==='function'?timeBlockDailySummary(day):{minutes:0,conflicts:0};
   const load=tasks.length*18+events.length*14+Math.min(40,(blocks.minutes||0)/12);
   return {day,tasks,events,blocks,load:Math.round(load)};
 });
}
function planningVerdict(){
 const p=planningEngine();
 const overload=p.filter(x=>x.load>=75), light=p.filter(x=>x.load<35);
 if(overload.length)return {type:'overload',title:'Semana com pontos de sobrecarga',text:`${overload.length} dia(s) concentram compromissos, tarefas ou blocos demais.`,days:overload};
 if(light.length>=2)return {type:'balance',title:'Há espaço para redistribuir seu trabalho',text:`${light.length} dia(s) estão relativamente leves e podem absorver tarefas.`,days:light};
 return {type:'balanced',title:'Semana bem distribuída',text:'A carga está relativamente equilibrada entre os dias.',days:[]};
}
function planningRecommendation(){

 if(v.type==='overload'){
   const from=p.find(x=>x.load<45&&x.day!==v.days[0].day);
   if(from&&v.days[0].tasks[0])return {text:`Considere mover “${v.days[0].tasks[0].title}” para ${agendaLabel(from.day)}.`,task:v.days[0].tasks[0],target:from.day};

function productivityPatterns(){
 const completed=(state.tasks||[]).filter(x=>x.done&&x.completedAt);
 const byDay={};
 completed.forEach(t=>{const d=new Date(t.completedAt);if(!isNaN(d)){const k=d.getDay();byDay[k]=(byDay[k]||0)+1;}});
 let bestDay=1,best=-1;Object.keys(byDay).forEach(k=>{if(byDay[k]>best){best=byDay[k];bestDay=Number(k)}});
 const names=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
 const recent=completed.filter(t=>t.completedAt&&Date.now()-new Date(t.completedAt).getTime()<30*86400000);
 const avg=recent.length?Math.round(recent.length/4.3*10)/10:0;
 return {bestDay,bestDayName:names[bestDay],recentCompleted:recent.length,weeklyAvg:avg};
}
function contextLoad(){

 const open=(state.tasks||[]).filter(x=>!x.done&&x.date===d);

 const blocks=typeof timeBlockDailySummary==='function'?timeBlockDailySummary(d):{minutes:0};
 const evening=hour>=17;
 return {commitments,open,late,blockMinutes:blocks.minutes||0,evening,score:Math.min(100,commitments*15+open.length*10+late.length*20+(blocks.minutes||0)/10)};
}
function dailyReviewEngine(){

 return suggest.slice(0,5);

function dailyReviewScore(){

}


function lifeOperatingScore(){
 const tasks=state.tasks||[],done=tasks.filter(x=>x.done).length,open=tasks.filter(x=>!x.done).length;
 const overdue=tasks.filter(x=>!x.done&&x.date&&x.date<today()).length;
 const habits=state.habits||[],log=state.habitLog||{};
 const activeHabits=habits.length;
 const habitDone=activeHabits?habits.filter(h=>{const id=h.id;return log[id]&&log[id][today()]}).length:0;
 const habitScore=activeHabits?Math.round(habitDone/activeHabits*100):70;
 const goals=state.goals||[],goalVals=goals.length?goals.map(g=>typeof goalProgress==='function'?goalProgress(g):0):[];
 const goalScore=goalVals.length?Math.round(goalVals.reduce((a,b)=>a+b,0)/goalVals.length):70;
 const fi=typeof financeMonthStats==='function'?financeMonthStats(financeMonthKey(today())):{income:0,out:0,balance:0};
 const financeScore=fi.income>0?Math.max(25,Math.min(100,Math.round(100-(fi.out/fi.income)*70))):70;
 const p=typeof schedulePressure==='function'?schedulePressure():{score:30};
 const execution=tasks.length?Math.max(20,Math.min(100,Math.round(done/(done+open)*100)-overdue*8+30)):75;
 const score=Math.round(execution*.30+habitScore*.18+goalScore*.18+financeScore*.16+(100-p.score)*.18);
 return {score:Math.max(0,Math.min(100,score)),execution,habitScore,goalScore,financeScore,loadScore:100-p.score,overdue};
}
function lifeOperatingTrend(){
 const now=lifeOperatingScore();
 const recent=(state.tasks||[]).filter(x=>x.done&&x.completedAt&&Date.now()-new Date(x.completedAt).getTime()<14*86400000).length;
 const older=(state.tasks||[]).filter(x=>x.done&&x.completedAt&&Date.now()-new Date(x.completedAt).getTime()>=14*86400000&&Date.now()-new Date(x.completedAt).getTime()<28*86400000).length;
 return {current:now.score,recent,older,delta:recent-older};
}
function lifeOperatingVerdict(){
 const s=lifeOperatingScore(),t=lifeOperatingTrend();
 if(s.score>=85)return {label:'Excelente',text:'Seu sistema mostra boa integração entre execução, hábitos, metas, finanças e carga.'};
 if(s.score>=70)return {label:'Estável',text:'A operação está saudável, com alguns pontos que podem ganhar atenção.'};
 if(s.score>=55)return {label:'Atenção',text:'Há sinais de pressão em uma ou mais áreas importantes.'};
 return {label:'Reorganizar',text:'O sistema indica sobrecarga ou baixa execução. Vale reduzir e reorganizar prioridades.'};
}

function strategicRadar(){
 const d=today(),out=[];
 (state.projects||[]).forEach(p=>{
   if(typeof projectHealth==='function'){
    const h=projectHealth(p);
    if(h&&h.risk==='risk')out.push({level:'critical',area:'Projeto',title:p.title,text:'Prazo ou execução em risco.',type:'projects',id:p.id});
   }
 });
 (state.goals||[]).forEach(g=>{
   if(typeof goalHealth==='function'){
    const h=goalHealth(g);
    if(h&&h.risk!=='normal')out.push({level:'attention',area:'Meta',title:g.title,text:'Ritmo abaixo do ideal ou prazo pressionado.',type:'goals',id:g.id});
   }
 });
 (typeof budgetStats==='function'?budgetStats():[]).forEach(b=>{
   if(b.pct>=80)out.push({level:b.pct>=100?'critical':'attention',area:'Financeiro',title:b.category,text:`${b.pct}% do orçamento utilizado.`,type:'budgets',id:b.id});
 });
 (state.tasks||[]).filter(t=>!t.done&&t.date&&t.date>=d).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8).forEach(t=>{
   const days=Math.round((new Date(t.date+'T12:00:00')-new Date(d+'T12:00:00'))/86400000);
   if(days<=3&&t.priority==='Alta')out.push({level:'attention',area:'Execução',title:t.title,text:`Prioridade alta em ${days<=0?'prazo imediato':days+' dia(s)'}.`,type:'tasks',id:t.id});
 });
 const order={critical:3,attention:2,info:1};
 return out.sort((a,b)=>order[b.level]-order[a.level]).slice(0,8);
}
function strategicOpportunity(){
 const candidates=[];
 (state.goals||[]).forEach(g=>{
   const p=typeof goalProgress==='function'?goalProgress(g):0;
   if(p>=60&&p<100)candidates.push({title:g.title,text:`Meta já está em ${p}%. Um próximo sprint pode levá-la ao fechamento.`,type:'goals',id:g.id});
 });
 (state.projects||[]).forEach(p=>{
   const pr=typeof projectProgress==='function'?projectProgress(p):0;

function strategicRadarVerdict(){

 if(r.some(x=>x.level==='critical'))return {label:'Intervenção',text:'Existem riscos que merecem ação antes de avançar novas frentes.'};

 return {label:'Estável',text:'Nenhum risco estratégico relevante foi detectado agora.'};
}


function decisionCenter(){
 const items=[];
 const radar=typeof strategicRadar==='function'?strategicRadar():[];
 radar.slice(0,5).forEach(x=>{
   items.push({priority:x.level==='critical'?1:x.level==='attention'?2:3,mode:x.level==='critical'?'EXECUTAR':'REVISAR',area:x.area,title:x.title,text:x.text,type:x.type,id:x.id});
 });
 const s=typeof lifeOperatingScore==='function'?lifeOperatingScore():{score:70,overdue:0};
 if(s.overdue>=2)items.push({priority:1,mode:'EXECUTAR',area:'Execução',title:'Zerar atrasos',text:`${s.overdue} tarefas vencidas`,type:'tasks'});
 const q=typeof smartTaskQueue==='function'?smartTaskQueue(6):[];
 q.slice(0,2).forEach(t=>{
   if(!items.some(x=>x.id===t.id))items.push({priority:3,mode:'EXECUTAR',area:'Próxima ação',title:t.title,text:'Tarefa com alta relevância operacional',type:'tasks',id:t.id});
 });
 const opp=typeof strategicOpportunity==='function'?strategicOpportunity():[];
 opp.slice(0,2).forEach(x=>{
   if(!items.some(i=>i.title===x.title))items.push({priority:4,mode:'AVANÇAR',area:'Oportunidade',title:x.title,text:x.text,type:x.type,id:x.id});
 });
 return items.sort((a,b)=>a.priority-b.priority).slice(0,7);
}
function decisionVerdict(){
 const d=decisionCenter();
 if(d.some(x=>x.priority===1))return {label:'Ação imediata',text:'Há decisões que não deveriam ser adiadas.'};
 if(d.some(x=>x.priority===2))return {label:'Ajuste recomendado',text:'Alguns pontos pedem revisão antes de abrir novas frentes.'};
 if(d.length)return {label:'Avanço',text:'O sistema tem espaço para execução e avanço estratégico.'};
 return {label:'Manutenção',text:'Nenhuma decisão relevante precisa ser tomada agora.'};
}
function decisionBuckets(){
 const d=decisionCenter();
 return {execute:d.filter(x=>x.mode==='EXECUTAR'),review:d.filter(x=>x.mode==='REVISAR'),advance:d.filter(x=>x.mode==='AVANÇAR')};
}


function lifeHealthMatrix(){
 const areas=state.lifeAreas||[];
 return areas.map(a=>{
   const score=Math.max(0,Math.min(100,Number(a.score||0)));
   const status=score>=80?'forte':score>=60?'estavel':score>=40?'atencao':'critica';
   return {...a,score,status};
 }).sort((a,b)=>a.score-b.score);
}
function lifeHealthVerdict(){

 if(!rows.length)return {label:'Sem leitura',text:'Cadastre suas áreas da vida para ativar esta leitura.'};
 const avg=Math.round(rows.reduce((s,x)=>s+x.score,0)/rows.length),weak=rows[0];
 if(weak.score<40)return {label:'Reequilibrar',text:`${weak.name} está em ${weak.score}% e merece atenção prioritária.`,avg};

}
function lifeHealthPriority(){return lifeHealthMatrix()[0]||null;}


function myLifeTrendData(){

 return windows.map(days=>{
   const since=now-days*86400000,until=days===14?now:now-(days-14)*86400000;
   const tasks=(state.tasks||[]).filter(t=>t.done&&t.completedAt).filter(t=>{const tm=new Date(t.completedAt).getTime();return tm>=since&&tm<until}).length;
   const expenses=(state.transactions||[]).filter(t=>t.date&&new Date(t.date+'T12:00:00').getTime()>=since&&new Date(t.date+'T12:00:00').getTime()<until&&!['income','entrada'].includes(String(t.type||'').toLowerCase())).reduce((a,t)=>a+Number(t.amount??t.value??0),0);
   return {days,tasks,expenses};
 });
}
function myLifeMomentum(){

function financeMonthStats(month){const ts=financeTransactionsForMonth(month),income=ts.filter(x=>['income','entrada'].includes(String(x.type||'').toLowerCase())).reduce((a,x)=>a+Number(x.amount??x.value??0),0),expense=ts.filter(x=>!['income','entrada'].includes(String(x.type||'').toLowerCase())).reduce((a,x)=>a+Number(x.amount??x.value??0),0);return {month,income,expense,out:expense,balance:income-expense,ts}}

function searchNorm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function searchHighlight(v,q){
 const text=esc(String(v??'')); if(!q)return text;
 const words=String(q).trim().split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
 return words.length?text.replace(new RegExp(`(${words.join('|')})`,'gi'),'<mark>$1</mark>'):text;
}
function searchSnippet(v,q){
 const raw=String(v??'').replace(/\s+/g,' ').trim(); if(!raw)return '';
 const n=searchNorm(raw), nq=searchNorm(q), at=n.indexOf(nq);
 if(at<0)return raw.length>120?raw.slice(0,120)+'…':raw;
 const st=Math.max(0,at-35), en=Math.min(raw.length,at+Math.max(nq.length,1)+75);
 return (st?'…':'')+raw.slice(st,en)+(en<raw.length?'…':'');
}

function timeBlockItems(day){return (state.timeBlocks||[]).filter(x=>x.date===day).sort((a,b)=>String(a.start||'').localeCompare(String(b.start||'')))}
function timeBlockMinutes(x){if(!x.start||!x.end)return 0;const [sh,sm]=x.start.split(':').map(Number),[eh,em]=x.end.split(':').map(Number);return Math.max(0,(eh*60+em)-(sh*60+sm))}
function timeBlockRange(x){if(!x.start||!x.end)return null;const p=s=>{const [h,m]=String(s).split(':').map(Number);return h*60+m};return {start:p(x.start),end:p(x.end)}}
function timeBlockConflicts(candidate,ignoreId=''){
 const c=timeBlockRange(candidate);if(!c||c.end<=c.start)return [];
 return timeBlockItems(candidate.date).filter(x=>String(x.id)!==String(ignoreId)).filter(x=>{const r=timeBlockRange(x);return r&&c.start<r.end&&c.end>r.start});
}
function timeBlockLoad(day){return timeBlockItems(day).reduce((a,x)=>a+timeBlockMinutes(x),0)}
function timeBlockDailySummary(day){
 const items=timeBlockItems(day),mins=timeBlockLoad(day),conflicts=items.reduce((n,x)=>n+timeBlockConflicts(x,x.id).length,0);
 return {items,minutes:mins,hours:Math.round(mins/60*10)/10,conflicts};
}
function weeklyTimeBlockSummary(){
 const days=agendaWeekDays(weekStartKey(today()));return days.map(day=>({day,...timeBlockDailySummary(day)}));
}

 search:()=>{const results=globalSearchResults(query),counts={};results.forEach(x=>counts[x.label]=(counts[x.label]||0)+1);const groups=Object.entries(counts);
 return `<div class="stack search-page">
  <div class="card search-hero">
   <div class="hero-label">Pesquisa global</div>
   <div class="search-big">${esc(query||'Encontre qualquer coisa no Godofredo')}</div>

   ${query&&results.length?`<div class="search-chips">${groups.map(([label,n])=>`<button class="chip" data-action="search-filter-label" data-label="${esc(label)}">${esc(label)} <span>${n}</span></button>`).join('')}</div>`:''}
  </div>
  ${query?`<div class="card"><div class="section-head"><div><h3>${results.length?'Resultados encontrados':'Nenhum resultado'}</h3><div class="section-caption">${results.length?'Abra um item para ir diretamente ao registro.':'Tente outra palavra, parte do nome ou uma categoria relacionada.'}</div></div><button class="btn" data-action="clear-global-search">Limpar</button></div>
   ${results.length?`<div class="search-groups-view">${groups.map(([label])=>`<section class="search-group-view" data-search-group="${esc(label)}"><div class="search-group-title"><span>${esc(label)}</span><small>${counts[label]} resultado(s)</small></div><div class="search-results">${results.filter(r=>r.label===label).map(r=>`<button class="search-result" data-action="search-open" data-type="${r.type}" data-id="${r.id}">
     <span class="search-result-icon">${r.label==='Tarefa'?'✓':r.label==='Agenda'?'◷':r.label==='Finanças'?'R$':r.label==='Leitura'?'▤':r.label==='Nota'?'✎':r.label==='Contato'?'◉':r.label==='Projeto'?'▣':r.label==='Meta'?'◎':r.label==='Viagem'?'⌂':r.label==='Hábito'?'◌':r.label==='Lembrete'?'◫':'•'}</span>
     <span class="search-result-main"><strong>${searchHighlight(r.title,query)}</strong><small>${esc(r.label)}${r.date?' · '+fmt(r.date):''}</small><em>${searchHighlight(r.snippet,query)}</em></span><span>→</span>
    </button>`).join('')}</div></section>`).join('')}</div>`:'<div class="empty search-empty">Não encontramos registros com esses termos.</div>'}
  </div>`:`<div class="card search-empty-card"><div class="search-empty-icon">⌕</div><h3>Comece sua busca</h3><p>Use a busca do topo ou exemplos abaixo para localizar rapidamente qualquer informação.</p><div class="search-suggestions">${['reunião','Lisboa','pagamento','livro','projeto','Jayne'].map(x=>`<button class="chip" data-action="search-suggest" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`}
 </div>`},

 myday:()=>{const d=myDayData();return `<div class="card today-control-panel"><div class="section-head"><div><span class="eyebrow">TODAY CONTROL PANEL</span><h3>Controle do dia</h3><div class="section-caption">Veja sua capacidade antes de adicionar mais coisas.</div></div><button class="btn" data-nav="focus">Modo Foco</button></div><div class="today-control-grid"><div><span>CAPACIDADE</span><strong>${universalHealth().capacity}%</strong></div><div><span>PRÓXIMA AÇÃO</span><strong>${esc(universalNextAction().text)}</strong></div><div><span>FINANÇAS DO MÊS</span><strong>${money(universalDailySnapshot().finance.balance)}</strong></div><div><span>DIREÇÃO</span><strong>${universalDailySnapshot().goals[0]?esc(universalDailySnapshot().goals[0].title):'Livre'}</strong></div></div></div><div class="stack"><div class="myday-hero card"><div><span class="eyebrow">MY DAY</span><h2>${esc(state.settings.name||'Jayne')}, este é o seu dia.</h2><p>${agendaLabel(today(),{weekday:'long',day:'numeric',month:'long'})}</p></div><div class="myday-score"><strong>${d.tasks.length+d.events.length+d.rem.length}</strong><span>itens de atenção</span></div></div><div class="grid"><div class="card s4 stat-card"><div class="small muted">Prioridade</div><div class="metric">${d.urgent.length}</div><div class="muted">tarefas de hoje</div></div><div class="card s4 stat-card"><div class="small muted">Agenda</div><div class="metric">${d.events.length}</div><div class="muted">compromissos</div></div><div class="card s4 stat-card"><div class="small muted">Hábitos</div><div class="metric">${d.doneHabits}/${d.habits.length}</div><div class="muted">concluídos hoje</div></div></div><div class="grid"><div class="card s7"><div class="section-head"><div><h3>Agora</h3><div class="section-caption">Comece pela ação mais relevante de hoje.</div></div></div>${d.urgent[0]?`<div class="now-action"><span class="eyebrow">PRÓXIMA AÇÃO</span><h3>${esc(d.urgent[0].title)}</h3><p>${d.urgent[0].description?esc(d.urgent[0].description):'Mantenha o restante do dia simples e execute esta primeira ação.'}</p><button class="btn primary" data-action="myday-open-task" data-id="${d.urgent[0].id}">Abrir tarefa</button></div>`:'<div class="empty">Nenhuma tarefa urgente para hoje.</div>'}</div><div class="card s5"><div class="section-head"><div><h3>Alertas</h3><div class="section-caption">O que merece atenção agora.</div></div></div>${d.late.slice(0,5).map(x=>`<button class="attention-row" data-action="myday-open-task" data-id="${x.id}"><span>⚠</span><div><strong>${esc(x.title)}</strong><small>Atrasada · ${fmt(x.date)}</small></div></button>`).join('')||'<div class="empty">Sem atrasos.</div>'}</div></div><div class="card"><div class="section-head"><div><h3>Agenda de hoje</h3><div class="section-caption">Compromissos sem sair do seu dia.</div></div><button class="btn" data-nav="agenda">Abrir agenda</button></div>${d.events.map(e=>`<button class="dashboard-event" data-action="agenda-open-item" data-type="events" data-id="${e.id}"><span class="event-time">${esc(e.time||'—')}</span><span><strong>${esc(e.title)}</strong><small>${esc(e.location||'')}</small></span><span>›</span></button>`).join('')||'<div class="empty">Nenhum compromisso hoje.</div>'}</div></div>`},
 command:()=>{const d=commandCenterData();return `<div class="card command-module-grid"><div class="section-head"><div><span class="eyebrow">COMMAND MODULE GRID</span><h3>Acesso operacional</h3><div class="section-caption">Abra as áreas centrais sem sair do Command Center.</div></div></div><div class="command-modules">${commandCenterModules().map(x=>`<button class="command-module" data-nav="${x[0]}"><span>${esc(x[2])}</span><strong>${esc(x[1])}</strong><small>Abrir módulo →</small></button>`).join('')}</div></div><div class="stack"><div class="command-hero card"><div><span class="eyebrow">COMMAND CENTER</span><h2>Qual é o próximo movimento?</h2><p>Uma central para decidir, executar e manter tudo em ritmo.</p></div><div class="godofredo-mark">✦</div></div><div class="grid"><div class="card s4 stat-card"><div class="small muted">Agora</div><div class="metric">${d.next?'1':'0'}</div><div class="muted">ação recomendada</div></div><div class="card s4 stat-card"><div class="small muted">Riscos</div><div class="metric">${d.projectRisks.length+d.goalRisks.length}</div><div class="muted">projetos + metas</div></div><div class="card s4 stat-card"><div class="small muted">Hoje</div><div class="metric">${d.tasks.length+d.events.length}</div><div class="muted">tarefas + compromissos</div></div></div><div class="grid"><div class="card s7"><div class="section-head"><div><h3>Próximo movimento</h3><div class="section-caption">Recomendação baseada no contexto atual.</div></div></div>${d.next?`<div class="now-action"><span class="eyebrow">RECOMENDADO</span><h3>${esc(d.next.title)}</h3><p>${d.next.date?'Prazo: '+fmt(d.next.date):'Sem prazo definido'}${d.next.priority?' · '+esc(d.next.priority):''}</p><button class="btn primary" data-action="command-open-next" data-id="${d.next.id}">Abrir e executar</button></div>`:'<div class="empty">Nenhuma ação pendente.</div>'}</div><div class="card s5"><div class="section-head"><div><h3>Riscos</h3><div class="section-caption">Itens que perderam ritmo.</div></div></div>${[...d.projectRisks.map(x=>({name:x.name||x.title,type:'Projeto'})),...d.goalRisks.map(x=>({name:x.name||x.title,type:'Meta'}))].map(x=>`<div class="risk-row"><span class="risk-dot"></span><div><strong>${esc(x.name)}</strong><small>${x.type}</small></div></div>`).join('')||'<div class="empty">Tudo sob controle.</div>'}</div></div></div>`},

/* Vision Board: independent media gallery */
const MEDIA_DB='godofredo-vision-media-v3';
const MEDIA_ORDER_KEY='godofredo-vision-gallery-order-v1';
let __mediaDB=null;
let __mediaFallback=[];
let __visionSort='manual';
function loadMediaOrder(){try{return JSON.parse(localStorage.getItem(MEDIA_ORDER_KEY)||'[]').map(String)}catch(e){return[]}}
function saveMediaOrder(order){try{localStorage.setItem(MEDIA_ORDER_KEY,JSON.stringify(order.map(String)))}catch(e){}}
function normalizeMediaOrder(media){const ids=media.map(m=>String(m.id)),saved=loadMediaOrder(),valid=saved.filter(id=>ids.includes(id)),missing=ids.filter(id=>!valid.includes(id)),order=[...valid,...missing];if(order.join('|')!==saved.join('|'))saveMediaOrder(order);return order}
function orderedMedia(media){const order=normalizeMediaOrder(media),idx=new Map(order.map((id,i)=>[id,i]));if(__visionSort==='newest')return [...media].sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));if(__visionSort==='oldest')return [...media].sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')));if(__visionSort==='name')return [...media].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR'));return [...media].sort((a,b)=>(idx.get(String(a.id))??999999)-(idx.get(String(b.id))??999999))}
async function moveMedia(idv,direction){const media=await getAllMedia(),order=normalizeMediaOrder(media),id=String(idv),i=order.indexOf(id),t=i+direction;if(i<0||t<0||t>=order.length)return;[order[i],order[t]]=[order[t],order[i]];saveMediaOrder(order);__visionSort='manual';const sort=document.getElementById('visionSort');if(sort)sort.value='manual';await renderVisionGallery()}
function reorderFromDom(){const ids=[...document.querySelectorAll('#visionGalleryHost .media-card')].map(el=>el.dataset.mediaId).filter(Boolean);if(ids.length)saveMediaOrder(ids)}
async function mediaDB(){if(__mediaDB)return __mediaDB;__mediaDB=new Promise((resolve,reject)=>{try{if(!window.indexedDB)return reject(new Error('IndexedDB indisponível'));const r=indexedDB.open(MEDIA_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('media'))r.result.createObjectStore('media',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Banco indisponível'));r.onblocked=()=>reject(new Error('Banco bloqueado'))}catch(err){reject(err)}});return __mediaDB}
async function addMedia(file){const payload={name:file.name,type:file.type,blob:file,createdAt:new Date().toISOString()};try{const db=await mediaDB();return await new Promise((resolve,reject)=>{const req=db.transaction('media','readwrite').objectStore('media').add(payload);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Falha ao salvar'))})}catch(err){const idv=Date.now()+Math.floor(Math.random()*100000);__mediaFallback.push({id:idv,...payload});return idv}}
async function getAllMedia(){try{const db=await mediaDB();return await new Promise((resolve,reject)=>{const rows=[],req=db.transaction('media','readonly').objectStore('media').openCursor();req.onsuccess=()=>{const c=req.result;if(!c)return resolve(rows);rows.push(c.value);c.continue()};req.onerror=()=>reject(req.error||new Error('Falha ao ler'))})}catch(err){return [...__mediaFallback]}}
async function getMediaById(idv){try{const db=await mediaDB();return await new Promise((resolve,reject)=>{const req=db.transaction('media','readonly').objectStore('media').get(Number(idv));req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}catch(err){return __mediaFallback.find(x=>String(x.id)===String(idv))}}
async function removeMedia(idv){
 const sid=String(idv);
 __mediaFallback=__mediaFallback.filter(x=>String(x.id)!==sid);
 saveMediaOrder(loadMediaOrder().filter(x=>String(x)!==sid));
 try{
   const db=await mediaDB();
   await new Promise((resolve,reject)=>{
     const tx=db.transaction('media','readwrite');
     const req=tx.objectStore('media').delete(Number(idv));
     req.onsuccess=()=>resolve();
     req.onerror=()=>reject(req.error||new Error('Falha ao excluir'));
     tx.onerror=()=>reject(tx.error||new Error('Falha ao excluir'));
   });
 }catch(err){console.warn('Exclusão persistente falhou:',err)}
}
async function uploadVisionFiles(files){const list=[...(files||[])].filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/')),status=document.getElementById('visionUploadStatus');if(!list.length){if(status)status.textContent='Selecione fotos ou vídeos.';return}if(status)status.textContent=`Adicionando ${list.length} arquivo(s)…`;let added=[];for(const f of list){try{added.push(String(await addMedia(f)))}catch(e){console.error(e)}}const current=loadMediaOrder();saveMediaOrder([...current,...added.filter(id=>!current.includes(id))]);if(status)status.textContent=`${added.length} arquivo(s) adicionado(s).`;if(added.length)toast(`${added.length} mídia(s) adicionada(s)`);await renderVisionGallery()}
async function visionLightboxItems(){
  const all=orderedMedia(await getAllMedia());
  return all.filter(visionMatches);
}
async function renderVisionLightbox(){
  const id=String(window.__visionLightboxMediaId||'');
  if(!id)return;
  const items=await visionLightboxItems();
  const idx=items.findIndex(m=>String(m.id)===id);
  if(idx<0){closeVisionMedia();return;}
  const m=items[idx];
  const content=document.getElementById('visionLightboxContent');
  const counter=document.getElementById('visionLightboxCounter');
  const caption=document.getElementById('visionLightboxCaption');
  const prev=document.getElementById('visionLightboxPrev');
  const next=document.getElementById('visionLightboxNext');
  if(!content)return;

  if(window.__visionLightboxObjectUrl)URL.revokeObjectURL(window.__visionLightboxObjectUrl);
  const url=URL.createObjectURL(m.blob);
  window.__visionLightboxObjectUrl=url;
  const isVideo=m.type.startsWith('video/');
  content.innerHTML=isVideo

 const active=projects.filter(p=>!['concluído','concluido','cancelado'].includes(String(p.status||'').toLowerCase()));
 const risks=projects.filter(p=>{const h=typeof projectHealth==='function'?projectHealth(p):'good';return h==='bad'||h==='warn'}).slice(0,4);
 const total=projects.length, avg=total?Math.round(projects.reduce((a,p)=>a+(typeof projectProgress==='function'?projectProgress(p):Number(p.progress||0)),0)/total):0;
 return `<div class="connected-grid">
  <section class="connected-card span-6"><span class="eyebrow">PROJECT ROOM</span><h3>Portfólio em contexto</h3><p>Projetos, tarefas e metas conectados em uma única leitura.</p><div class="connected-kpi">${avg}%</div><div class="connected-meta">progresso médio · ${active.length} ativos de ${total}</div><div class="connected-actions"><button class="btn" data-action="new-project">+ Projeto</button><button class="btn" data-nav="tasks">Tarefas</button><button class="btn" data-nav="goals">Metas</button></div></section>
  <section class="connected-card span-6"><span class="eyebrow">PROJECT RISK RADAR</span><h3>Onde o ritmo caiu</h3><div class="connected-list">${risks.map(p=>`<button class="connected-row" data-action="edit" data-type="projects" data-id="${p.id}"><span><strong>${esc(p.title||p.name)}</strong><br><small>${typeof projectProgress==='function'?projectProgress(p):Number(p.progress||0)}% · risco</small></span><span>›</span></button>`).join('')||'<div class="empty">Nenhum projeto pedindo intervenção.</div>'}</div></section>
  <section class="connected-card span-12"><span class="eyebrow">CROSS-LINKS</span><h3>Relações importantes</h3><div class="connected-list">${active.slice(0,6).map(p=>{
    const pt=tasks.filter(t=>String(t.projectId)===String(p.id)&&!t.done).length;
    const pg=goals.filter(g=>String(g.projectId||'')===String(p.id)).length;
    return `<div class="connected-row"><span><strong>${esc(p.title||p.name)}</strong><br><small>${pt} tarefa(s) abertas · ${pg} meta(s) relacionada(s)</small></span><button class="btn" data-action="project-tasks" data-id="${p.id}">Abrir</button></div>`;
  }).join('')||'<div class="empty">Crie projetos para construir seu espaço de execução.</div>'}</div></section>
 </div>`;
}
function goalCommandLayer(){
 const goals=state.goals||[], open=goals.filter(g=>Number(g.progress||0)<100);
 const top=open.slice().sort((a,b)=>Number(b.progress||0)-Number(a.progress||0))[0];
 return `<div class="connected-grid">
  <section class="connected-card span-8"><span class="eyebrow">GOAL COMMAND</span><h3>Da intenção à próxima ação</h3><p>Use marcos para enxergar a trajetória das suas metas.</p>${top?`<div class="connected-kpi">${Math.round(Number(top.progress||0))}%</div><div class="connected-meta">${esc(top.title||top.name)} · ${open.length} meta(s) abertas</div><div class="milestone-track">${[25,50,75,100].map(n=>`<div class="milestone ${Number(top.progress||0)>=n?'active':''}">${n}%</div>`).join('')}</div><div class="connected-actions"><button class="btn" data-action="edit" data-type="goals" data-id="${top.id}">Editar meta</button><button class="btn" data-action="goal-tasks" data-id="${top.id}">Tarefas</button></div>`:'<div class="empty" style="margin-top:14px">Nenhuma meta aberta.</div>'}</section>
  <section class="connected-card span-4"><span class="eyebrow">GOAL HEALTH</span><div class="connected-list">${goals.slice(0,5).map(g=>`<div class="connected-row"><span><strong>${esc(g.title||g.name)}</strong><br><small>${Math.round(Number(g.progress||0))}%</small></span><span>${Number(g.progress||0)>=80?'🟢':Number(g.progress||0)>=40?'🟡':'🔴'}</span></div>`).join('')||'<div class="empty">Cadastre uma meta.</div>'}</div></section>
 </div>`;
}

function focusIntelligenceLayer(){
 const tasks=state.tasks||[], done=tasks.filter(t=>t.done);
 const high=tasks.filter(t=>!t.done&&['alta','crítica','critica'].includes(String(t.priority||'').toLowerCase())).length;
 let byHour={}; done.forEach(t=>{const v=t.completedAt||'';if(String(v).includes('T')){const h=new Date(v).getHours();if(!Number.isNaN(h))byHour[h]=(byHour[h]||0)+1}});
 const best=Object.entries(byHour).sort((a,b)=>b[1]-a[1])[0];
 const sessions=Number(localStorage.getItem('godofredo-focus-sessions-v1')||0);
 return `<div class="connected-grid"><section class="connected-card span-8"><span class="eyebrow">FOCUS INTELLIGENCE</span><h3>Trabalhe no horário que favorece sua execução.</h3><p>${best?`Seu maior volume de conclusões registradas ocorreu por volta de ${String(best[0]).padStart(2,'0')}:00.`:'Ainda não há dados suficientes de conclusão por horário.'}</p><div class="focus-stats"><div class="focus-stat"><b>${sessions}</b><span>sessões registradas</span></div><div class="focus-stat"><b>${done.length}</b><span>tarefas concluídas</span></div><div class="focus-stat"><b>${high}</b><span>alta prioridade</span></div><div class="focus-stat"><b>${universalHealth().capacity}%</b><span>capacidade restante</span></div></div></section><section class="connected-card span-4"><span class="eyebrow">FOCUS MOVE</span><h3>Próxima melhor sessão</h3><p>Proteja 25 minutos para uma tarefa de alta prioridade.</p><div class="connected-actions"><button class="btn primary" data-action="focus-preset" data-min="25">25 min</button><button class="btn" data-nav="tasks">Escolher tarefa</button></div></section></div>`;
}

function enhanceConnectedRoute(route){
 const root=document.getElementById('view');if(!root)return;
 const host=document.createElement('div');
 const layers={projects:projectRoomLayer,goals:goalCommandLayer,contacts:crmLayer,trips:travelCommandLayer,library:knowledgeLayer,readings:knowledgeLayer,notes:knowledgeLayer,focus:focusIntelligenceLayer,home:homeManagementLayer,timeline:lifeGraphLayer};
 if(layers[route]){host.innerHTML=layers[route]();root.prepend(host)}
}

function enhanceRoute(route){
 enhanceConnectedRoute(route);
 const root=document.getElementById('view'); if(!root)return;
 const host=document.createElement('div');
 if(route==='dashboard'){host.innerHTML=premiumDashboardLayer();root.prepend(host)}
 else if(route==='myday'){host.innerHTML=premiumMyDayLayer();root.prepend(host)}

}

     const q=window.__taskQuery.toLowerCase().trim();
     const arr=filteredTasks().filter(t=>`${t.title||''} ${t.category||''} ${relation('projects',t.projectId)} ${relation('goals',t.goalId)} ${relation('trips',t.tripId)} ${t.description||''}`.toLowerCase().includes(q));

let paletteIndex=0;
function openPalette(){
 const bg=document.getElementById('actionPalette'); if(!bg)return;
 bg.classList.add('show'); bg.setAttribute('aria-hidden','false');
 const inp=document.getElementById('paletteInput'); if(inp){inp.value='';renderPalette();setTimeout(()=>inp.focus(),20)}
}
function closePalette(){
 const bg=document.getElementById('actionPalette'); if(!bg)return;
 bg.classList.remove('show'); bg.setAttribute('aria-hidden','true');
}
function renderPalette(){
 const inp=document.getElementById('paletteInput'), list=document.getElementById('paletteList'); if(!inp||!list)return;
 const q=(inp.value||'').toLowerCase().trim();
 const arr=PALETTE_ACTIONS.filter(x=>`${x.label} ${x.keys}`.toLowerCase().includes(q));
 paletteIndex=Math.min(paletteIndex,Math.max(0,arr.length-1));
 list.innerHTML=arr.map((x,i)=>`<button class="palette-item ${i===paletteIndex?'selected':''}" data-palette-index="${i}"><span class="pi-icon">${x.icon}</span><span>${esc(x.label)}</span></button>`).join('')||'<div class="empty">Nenhuma ação encontrada.</div>';
}
function executePalette(){
 const inp=document.getElementById('paletteInput'); const q=(inp?.value||'').toLowerCase().trim();
 const arr=PALETTE_ACTIONS.filter(x=>`${x.label} ${x.keys}`.toLowerCase().includes(q));
 if(!arr[paletteIndex])return;
 const run=arr[paletteIndex].run; closePalette(); setTimeout(run,20);
}

   if(a==='quick-capture'){newFor('inbox');return}

<script>
function openAllPagesMenu(){
  const m=document.getElementById('allPagesMenu');
  if(!m)return;
  m.classList.add('show');
  m.setAttribute('aria-hidden','false');
  const s=document.getElementById('allPagesMenuSearch');
  if(s){s.value='';filterAllPagesMenu('');setTimeout(()=>s.focus(),30)}
}
function closeAllPagesMenu(){
  const m=document.getElementById('allPagesMenu');
  if(!m)return;
  m.classList.remove('show');
  m.setAttribute('aria-hidden','true');
}
function filterAllPagesMenu(q){
  const query=String(q||'').trim().toLowerCase();
  const items=[...document.querySelectorAll('#allPagesMenu .app-menu-item')];
  const groups=[...document.querySelectorAll('#allPagesMenu .app-all-menu-group')];
  let shown=0;
  items.forEach(item=>{
    const label=item.dataset.label||'';
    const match=!query||label.includes(query);
    item.style.display=match?'flex':'none';
    if(match)shown++;
  });
  groups.forEach(group=>{
    const any=[...group.querySelectorAll('.app-menu-item')].some(i=>i.style.display!=='none');
    group.style.display=any?'block':'none';
  });
  const empty=document.getElementById('allPagesMenuEmpty');
  if(empty)empty.style.display=shown?'none':'block';
}
document.addEventListener('click',e=>{
  const action=e.target.closest('[data-action]');
  if(action){
    const a=action.dataset.action;
    if(a==='open-all-menu'){e.stopImmediatePropagation();openAllPagesMenu();return}
    if(a==='close-all-menu'){e.stopImmediatePropagation();closeAllPagesMenu();return}
  }
  const route=e.target.closest('[data-menu-route]');
  if(route){
    const key=route.dataset.menuRoute;
    closeAllPagesMenu();
    if(typeof go==='function')go(key);
  }
  const menu=document.getElementById('allPagesMenu');
  if(menu&&e.target===menu)closeAllPagesMenu();
});
document.addEventListener('input',e=>{
  if(e.target.id==='allPagesMenuSearch')filterAllPagesMenu(e.target.value);
});
document.addEventListener('keydown',e=>{
  const menu=document.getElementById('allPagesMenu');
  if(!menu?.classList.contains('show'))return;
  if(e.key==='Escape'){closeAllPagesMenu();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    const s=document.getElementById('allPagesMenuSearch');
    if(s)s.focus();
  }
});
</script>
